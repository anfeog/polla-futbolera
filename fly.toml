app = "polla-mundial-2026"
primary_region = "mad"          # Madrid — más cercano a vosotros

[build]

[env]
  DATABASE_PATH = "/data/polla.db"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false    # NO apagar — queremos que siempre esté disponible
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "polla_data"
  destination = "/data"
  initial_size = "1gb"

[checks]
  [checks.alive]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "10s"
    type = "http"
