{% extends "base.html" %}
{% block title %}Entrar — Polla Mundial 2026{% endblock %}
{% block content %}
<div class="min-h-[85vh] flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="text-7xl mb-3 drop-shadow-lg">⚽</div>
            <p class="font-display text-xs uppercase tracking-[0.4em] text-sky-400 mb-2">FIFA World Cup</p>
            <h1 class="font-display font-bold text-5xl tracking-wide brand-gradient">MUNDIAL 2026</h1>
            <p class="text-white/50 mt-2 font-display uppercase tracking-[0.25em] text-sm">Polla Futbolera</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/40 text-red-300 px-4 py-3 rounded-xl mb-4 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login"
              class="bg-gradient-to-b from-white/[0.08] to-white/[0.02] rounded-2xl p-6 border border-white/10 space-y-4 backdrop-blur">
            <div>
                <label class="block font-display text-xs uppercase tracking-wider text-white/50 mb-1.5">Usuario</label>
                <input name="username" type="text" required autofocus
                    class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400/50 transition">
            </div>
            <div>
                <label class="block font-display text-xs uppercase tracking-wider text-white/50 mb-1.5">Contraseña</label>
                <input name="password" type="password" required
                    class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400/50 transition">
            </div>
            <button type="submit"
                class="w-full brand-bar text-ink font-display font-bold uppercase tracking-wider py-3 rounded-xl hover:opacity-90 transition shadow-lg shadow-sky-500/20 mt-2">
                Entrar a la cancha
            </button>
        </form>
    </div>
</div>
{% endblock %}
