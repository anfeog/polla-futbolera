<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Polla Mundial 2026{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heavy: ['Anton', 'sans-serif'],
                        display: ['Oswald', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        pitch: '#0a1410',
                        ink: '#070b16',
                    },
                    keyframes: {
                        livepulse: {
                            '0%,100%': { opacity: '1' },
                            '50%': { opacity: '0.35' },
                        },
                    },
                    animation: {
                        livepulse: 'livepulse 1.4s ease-in-out infinite',
                    },
                },
            },
        }
    </script>
    <link rel="icon" href="/static/logoapp.png" type="image/png">
    <style>
        body {
            background-color: #070b16;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(56,189,248,0.12), transparent 60%),
                radial-gradient(ellipse 60% 40% at 90% 10%, rgba(217,70,239,0.10), transparent 55%),
                radial-gradient(ellipse 60% 50% at 0% 100%, rgba(16,185,129,0.10), transparent 55%);
            background-attachment: fixed;
        }
        /* Paleta y franja multicolor oficial FIFA World Cup 26 */
        .brand-gradient {
            background: linear-gradient(90deg, #e2231a 0%, #7c3aed 22%, #14b8a6 44%, #2563eb 62%, #ec4899 80%, #a3e635 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-bar { background: linear-gradient(90deg, #2dd4bf, #38bdf8 45%, #d946ef); }
        /* Franja de segmentos duros estilo identidad 26 */
        .fifa-strip {
            background: linear-gradient(90deg,
                #e2231a 0 16.66%, #7c3aed 16.66% 33.33%, #14b8a6 33.33% 50%,
                #2563eb 50% 66.66%, #ec4899 66.66% 83.33%, #a3e635 83.33% 100%);
        }
        /* Cápsula del marcador (scorebug) */
        .scorebug {
            background: #0b0b0d;
            box-shadow: 0 8px 30px rgba(0,0,0,0.45);
        }
    </style>
</head>
<body class="text-white min-h-screen font-sans antialiased">

{% if user %}
<nav class="sticky top-0 z-30 backdrop-blur-xl bg-ink/70 border-b border-white/10">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="/partidos" class="flex items-center gap-2 group">
            <img src="/static/logoapp.png" alt="Polla Futbolera" class="h-8 object-contain drop-shadow">
            <span class="font-display font-bold text-xl tracking-wide brand-gradient">MUNDIAL 2026</span>
        </a>
        <div class="flex items-center gap-1 sm:gap-2 text-sm font-medium">
            <a href="/partidos" class="px-2.5 py-1.5 rounded-lg hover:bg-white/10 transition">Partidos</a>
            <a href="/cuadro" class="px-2.5 py-1.5 rounded-lg hover:bg-white/10 transition">Cuadro</a>
            <a href="/goleadores" class="px-2.5 py-1.5 rounded-lg hover:bg-white/10 transition">Goles</a>
            <a href="/premios" class="px-2.5 py-1.5 rounded-lg hover:bg-white/10 transition">Premios</a>
            <a href="/ranking" class="px-2.5 py-1.5 rounded-lg hover:bg-white/10 transition">Tabla</a>
            <a href="/como-jugar" class="px-2.5 py-1.5 rounded-lg hover:bg-white/10 transition text-white/50" title="Cómo jugar">?</a>
            {% if user.is_admin %}
            <a href="/admin" class="px-2.5 py-1.5 rounded-lg text-amber-400 hover:bg-amber-400/10 transition">Admin</a>
            {% endif %}
            <a href="/perfil" class="ml-1 flex items-center gap-1.5 pl-1 pr-2.5 py-1 rounded-full bg-white/5 border border-white/10 hover:bg-white/15 transition" title="Mi perfil">
                <span class="text-lg leading-none">{{ user.avatar }}</span>
                <span class="hidden sm:inline text-white/70 text-xs uppercase tracking-wider font-display">{{ user.username }}</span>
            </a>
            <a href="/logout" class="px-2.5 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:bg-white/15 transition text-xs">Salir</a>
        </div>
    </div>
    <div class="h-0.5 brand-bar opacity-80"></div>
</nav>
{% endif %}

<main class="max-w-4xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
</main>

</body>
</html>
